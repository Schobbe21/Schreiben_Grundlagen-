<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wer ist es?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f1e9;
      color: #111;
      font-family: "Libre Baskerville", serif;
    }

    .page {
      width: min(1200px, 92vw);
      margin: 0 auto;
      padding: 60px 0 90px;
    }

    /* HEADER */

    .header {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      min-height: 430px;
      border-bottom: 1px solid #111;
      margin-bottom: 70px;
    }

    .title {
      grid-column: 1 / 6;
      align-self: start;
      margin: 0;

      font-family: "Oswald", sans-serif;
      font-size: clamp(85px, 13vw, 180px);
      font-weight: 700;
      line-height: .86;
      letter-spacing: -.035em;
      text-transform: uppercase;
    }

    .intro {
      grid-column: 8 / 13;
      align-self: end;
      padding-bottom: 42px;
      font-size: 16px;
      line-height: 1.7;
    }

    .intro strong {
      font-family: "Oswald", sans-serif;
      text-transform: uppercase;
      font-size: 24px;
      letter-spacing: .02em;
    }


    /* PERSONEN */

    .people {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      column-gap: 22px;
      row-gap: 90px;
    }

    .person {
      position: relative;
      padding-top: 20px;
      border-top: 1px solid #111;
    }

    .person:nth-child(1) {
      grid-column: 1 / 7;
    }

    .person:nth-child(2) {
      grid-column: 8 / 13;
      margin-top: 110px;
    }

    .person:nth-child(3) {
      grid-column: 2 / 7;
    }

    .person:nth-child(4) {
      grid-column: 7 / 13;
      margin-top: 70px;
    }

    .person:nth-child(5) {
      grid-column: 1 / 6;
    }

    .person:nth-child(6) {
      grid-column: 7 / 12;
      margin-top: 110px;
    }


    /* BILDER */

    .portrait {
      display: block;
      width: 100%;
      height: 330px;
      margin-bottom: 24px;

      object-fit: cover;
      object-position: center;

      filter: grayscale(100%);
    }

    .person:nth-child(1) .portrait {
      height: 390px;
    }

    .person:nth-child(2) .portrait {
      height: 310px;
    }

    .person:nth-child(4) .portrait {
      height: 370px;
    }

    .person:nth-child(6) .portrait {
      height: 350px;
    }


    /* TYPOGRAFIE */

    .number {
      margin-bottom: 20px;

      font-family: "Oswald", sans-serif;
      font-weight: 700;
      font-size: 92px;
      line-height: .85;
    }

    .name {
      margin: 0;

      font-family: "Oswald", sans-serif;
      font-size: clamp(42px, 6vw, 78px);
      font-weight: 600;
      line-height: .95;
      text-transform: uppercase;
    }


    /* AUDIO */

    .play {
      margin-top: 24px;
      padding: 0;

      border: none;
      background: none;

      font-family: "Oswald", sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: .08em;

      cursor: pointer;
      color: #111;
    }

    .play:hover {
      font-style: italic;
    }

    .play::before {
      content: "▶";
      margin-right: 10px;
    }

    .play.playing::before {
      content: "■";
    }

    audio {
      display: none;
    }


    /* FOOTER */

    .footer {
      margin-top: 110px;
      padding-top: 20px;
      border-top: 1px solid #111;

      font-family: "Oswald", sans-serif;
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }


    /* MOBILE */

    @media (max-width: 700px) {

      .page {
        padding-top: 35px;
      }

      .header {
        display: block;
        min-height: auto;
        padding-bottom: 35px;
      }

      .title {
        margin-bottom: 70px;
      }

      .intro {
        max-width: 420px;
      }

      .people {
        display: block;
      }

      .person,
      .person:nth-child(n) {
        margin: 0 0 80px;
      }

      .portrait,
      .person:nth-child(n) .portrait {
        height: min(110vw, 500px);
      }

      .number {
        font-size: 70px;
      }
    }

  </style>
</head>


<body>

<main class="page">

  <header class="header">

    <h1 class="title">
      Wer<br>
      ist<br>
      es?
    </h1>

    <div class="intro">

      <strong>Hört genau hin.</strong>

      <p>
        Hört euch die sechs Selbstvorstellungen an
        und ergänzt die fehlenden Informationen
        auf eurem Arbeitsblatt.
      </p>

    </div>

  </header>


  <section class="people">


    <!-- 01 JÜRGEN -->

    <article class="person">

      <img
        class="portrait"
        src="JK.jpg"
        alt="Jürgen"
      >

      <div class="number">01</div>
      <h2 class="name">Jürgen</h2>

      <button class="play" data-audio="juergen">
        Hören
      </button>

      <audio
        id="juergen"
        src="Juergen.mp3"
      ></audio>

    </article>


    <!-- 02 ANKE -->

    <article class="person">

      <img
        class="portrait"
        src="AE.jpg"
        alt="Anke"
      >

      <div class="number">02</div>
      <h2 class="name">Anke</h2>

      <button class="play" data-audio="anke">
        Hören
      </button>

      <audio
        id="anke"
        src="Anke.mp3"
      ></audio>

    </article>


    <!-- 03 LENA -->

    <article class="person">

      <img
        class="portrait"
        src="LML.jpg"
        alt="Lena"
      >

      <div class="number">03</div>
      <h2 class="name">Lena</h2>

      <button class="play" data-audio="lena">
        Hören
      </button>

      <audio
        id="lena"
        src="Lena.mp3"
      ></audio>

    </article>


    <!-- 04 MARCEL -->

    <article class="person">

      <img
        class="portrait"
        src="MoB.jpg"
        alt="Marcel"
      >

      <div class="number">04</div>
      <h2 class="name">Marcel</h2>

      <button class="play" data-audio="marcel">
        Hören
      </button>

      <audio
        id="marcel"
        src="Marcel.mp3"
      ></audio>

    </article>


    <!-- 05 ELYAS -->

    <article class="person">

      <img
        class="portrait"
        src="MB.jpg"
        alt="Elyas"
      >

      <div class="number">05</div>
      <h2 class="name">Elyas</h2>

      <button class="play" data-audio="elyas">
        Hören
      </button>

      <audio
        id="elyas"
        src="Elyas.mp3"
      ></audio>

    </article>


    <!-- 06 PAMELA -->

    <article class="person">

      <img
        class="portrait"
        src="PR.jpg"
        alt="Pamela"
      >

      <div class="number">06</div>
      <h2 class="name">Pamela</h2>

      <button class="play" data-audio="pamela">
        Hören
      </button>

      <audio
        id="pamela"
        src="Pamela.mp3"
      ></audio>

    </article>


  </section>


  <footer class="footer">
    Deutsch · Schreibkurs · Selbstvorstellung
  </footer>

</main>


<script>

  const buttons = document.querySelectorAll(".play");
  const audios = document.querySelectorAll("audio");

  buttons.forEach(button => {

    button.addEventListener("click", () => {

      const audio = document.getElementById(
        button.dataset.audio
      );

      /* Andere Audios stoppen */

      audios.forEach(otherAudio => {

        if (otherAudio !== audio) {
          otherAudio.pause();
          otherAudio.currentTime = 0;
        }

      });


      /* Andere Buttons zurücksetzen */

      buttons.forEach(otherButton => {

        if (otherButton !== button) {
          otherButton.classList.remove("playing");
          otherButton.textContent = "Hören";
        }

      });


      /* Aktuelles Audio starten oder stoppen */

      if (audio.paused) {

        audio.play();

        button.classList.add("playing");
        button.textContent = "Stop";

      } else {

        audio.pause();

        button.classList.remove("playing");
        button.textContent = "Hören";

      }


      /* Nach Ende zurücksetzen */

      audio.onended = () => {

        button.classList.remove("playing");
        button.textContent = "Hören";

      };

    });

  });

</script>

</body>
</html>
